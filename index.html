<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stars" />
<title>Alone Among the Stars</title>
<meta property="og:title" content="Alone Among the Stars" />
<meta property="og:description" content="A solo journaling RPG about exploring fantastic planets, by Takuma Okada." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://djessemann.github.io/alone-among-the-stars-tribute/" />
<meta property="og:image" content="https://djessemann.github.io/alone-among-the-stars-tribute/icons/share.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://djessemann.github.io/alone-among-the-stars-tribute/icons/share.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon.png" />
<link rel="apple-touch-icon" href="icons/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000;
    --fg:#f2f0ea;
    --dim:#8a8a8a;
    --dimmer:#5a5a5a;
    --red:#e2382f;
    --card:#f5f3ee;
    --card-ink:#111;
    --card-red:#c4322b;
    --line:#2a2a2a;
    --pad: max(20px, env(safe-area-inset-left)) ;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    /* content column width + its side padding, shared by the screen and the
       bottom chrome so they always line up across phone / iPad / desktop */
    --col: 560px;
    --gutter: 24px;
    /* home/help circles grow a touch on roomier screens, capped so they never
       balloon on tablet/desktop */
    --chrome-size: clamp(44px, 11.5vw, 52px);
    font-size:16px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* Lock the document: the page can't drag-scroll or rubber-band (native-app feel). */
  html,body{ margin:0; width:100%; height:100%; height:100dvh; background:var(--bg); overflow:hidden; position:fixed; }
  body{
    font-family:'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color:var(--fg);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  /* #root is the single scroll surface. Screens that fit feel pinned in place;
     only longer content (text fields, journals, the archive) scrolls — and
     overscroll-behavior:contain keeps that scroll from chaining to the page. */
  #root{ height:100%; height:100dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  button{ font-family:inherit; cursor:pointer; }
  /* prevent text selection on UI, allow in writing fields */
  body{ -webkit-user-select:none; user-select:none; }
  textarea, input, .selectable{ -webkit-user-select:text; user-select:text; }

  /* ---------- layout shell ---------- */
  .screen{
    position:relative;
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding: calc(var(--safe-top) + 20px) var(--gutter) calc(var(--safe-bottom) + 20px);
    max-width:var(--col);
    margin:0 auto;
    width:100%;
  }
  /* reserve a band at the bottom so nothing sits under the fixed home/help chrome */
  .screen.with-chrome{ padding-bottom: calc(var(--safe-bottom) + var(--chrome-size) + 42px); }
  .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; }
  /* roll screens: the die (or die+card) is anchored to a fixed upper position
     so it does not jump when the result text and button appear below it */
  .center.anchored{ justify-content:flex-start; padding-top:clamp(24px, 12vh, 110px); }
  .grow{ flex:1; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }

  /* ---------- typography ---------- */
  h1{ font-family:'Press Start 2P', ui-monospace, monospace;
      font-size: clamp(18px, 6.5vw, 26px); font-weight:400; line-height:1.4; margin:0; letter-spacing:0; }
  .byline{ color:var(--fg); font-size:13px; margin-top:14px; }
  .tagline{ color:var(--dim); font-size:13px; line-height:1.5; max-width:26ch; }
  .flavor{ font-style:italic; color:var(--dim); font-size:13.5px; line-height:1.55; max-width:28ch; }
  .instruction{ color:var(--fg); font-size:13.5px; line-height:1.55; max-width:28ch; }
  .narration{ font-style:italic; color:var(--dim); font-size:14.5px; line-height:1.6; max-width:26ch; }
  .heading{ color:var(--fg); font-size:14.5px; letter-spacing:1px; }

  /* ---------- buttons ---------- */
  .btn{
    appearance:none; border:1.5px solid var(--fg); background:transparent; color:var(--fg);
    font-size:14.5px; padding:10px 26px; border-radius:0; font-weight:400;
    transition:transform .08s ease, opacity .15s ease;
    min-width:148px;
  }
  .btn:active{ transform:scale(.96); }
  .btn.primary{ background:var(--fg); color:#000; border-color:var(--fg); }
  .btn.danger{ color:var(--red); border-color:var(--red); background:transparent; }
  .btn.danger.solid{ background:transparent; }
  .btn-stack{ display:flex; flex-direction:column; align-items:center; gap:14px; }

  /* ---------- persistent chrome ----------
     A bottom bar pinned to the safe-area bottom. It mirrors the content column
     (same max-width + side gutters as .screen), so on phones the buttons hug the
     screen edges and on iPad/desktop they line up with the centered content
     instead of drifting out to the far corners. The bar itself ignores pointer
     events; only the circles catch taps, leaving the middle clickable. */
  .chrome-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0;
    width:100%; max-width:var(--col);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 var(--gutter) calc(var(--safe-bottom) + 18px);
    z-index:40; pointer-events:none;
  }
  .chrome, .chrome-spacer{ width:var(--chrome-size); height:var(--chrome-size); flex:0 0 auto; }
  .chrome{ border-radius:0; border:1.5px solid var(--fg); background:#000;
    display:flex; align-items:center; justify-content:center; color:var(--fg);
    pointer-events:auto; transition:transform .08s ease; }
  .chrome:active{ transform:scale(.94); }
  /* chrome + tool icons are pixel sprites that carry their own dimensions */
  .chrome svg{ display:block; }

  /* ---------- dice (8-bit) ----------
     Pixel-notched corners come from the four offset box-shadows: each extends
     the face color one border-unit past an edge, leaving the corner pixel
     uncovered — the classic console "rounded" corner. Shadows are hard offsets
     (no blur); the inset shadow is a chunky bottom-right bevel. */
  .die{ width:128px; height:128px; background:var(--card); display:grid;
    grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:18px; gap:4px; flex:0 0 auto;
    box-shadow: 0 -4px 0 0 var(--card), 0 4px 0 0 var(--card),
                -4px 0 0 0 var(--card), 4px 0 0 0 var(--card),
                inset -6px -6px 0 0 #d9d5c9,
                8px 8px 0 0 #23231f; }
  .die > span{ display:flex; align-items:center; justify-content:center; }
  .pip{ display:block; width:18px; height:18px; background:#111; }
  .die.rolling{ animation:shake .24s steps(1,end) infinite; }
  @keyframes shake{ 0%,100%{ transform:translate(-3px,-2px) } 25%{ transform:translate(3px,1px) }
    50%{ transform:translate(-2px,3px) } 75%{ transform:translate(2px,-3px) } }
  /* medium die — sits beside the revealed card */
  .die.mid{ width:96px; height:96px; padding:12px; gap:3px;
    box-shadow: 0 -3px 0 0 var(--card), 0 3px 0 0 var(--card),
                -3px 0 0 0 var(--card), 3px 0 0 0 var(--card),
                inset -5px -5px 0 0 #d9d5c9,
                6px 6px 0 0 #23231f; }
  .die.mid .pip{ width:13px; height:13px; }
  /* thumbnail die — beside each entry's card */
  .die.thumb{ width:48px; height:48px; padding:6px; gap:2px;
    box-shadow: 0 -2px 0 0 var(--card), 0 2px 0 0 var(--card),
                -2px 0 0 0 var(--card), 2px 0 0 0 var(--card),
                inset -3px -3px 0 0 #d9d5c9,
                3px 3px 0 0 #23231f; }
  .die.thumb .pip{ width:7px; height:7px; }

  /* ---------- cards (8-bit pixel) ----------
     Same pixel-border technique as the dice. Suit marks are pixel-art SVG
     sprites (see PIXEL_SPRITES in app.src.jsx); ranks are Press Start 2P. */
  .card-grid{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; max-width:380px; }
  .card{
    position:relative; flex:0 0 auto;
    width:96px; height:140px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  .card:active{ transform:scale(.95); }
  /* face down: dark-maroon checkerboard dither, brick pixel border, pixel star —
     kept a notch lighter than the black screen so the backs read as objects */
  .card.back{
    background: repeating-conic-gradient(#421411 0% 25%, #2a0b09 0% 50%) 0 0 / 8px 8px;
    color:#a4675e;
    box-shadow: 0 -3px 0 0 #71271f, 0 3px 0 0 #71271f,
                -3px 0 0 0 #71271f, 3px 0 0 0 #71271f;
  }
  .card.back svg{ width:28px; height:28px; display:block; }
  /* picked-but-not-yet-flipped: layered pixel rings + lift, no reveal */
  .card.back.selected{
    color:var(--fg);
    transform:translateY(-5px);
    box-shadow: 0 -3px 0 0 var(--fg), 0 3px 0 0 var(--fg),
                -3px 0 0 0 var(--fg), 3px 0 0 0 var(--fg),
                0 -6px 0 0 #000, 0 6px 0 0 #000, -6px 0 0 0 #000, 6px 0 0 0 #000,
                0 -9px 0 0 #6a675f, 0 9px 0 0 #6a675f, -9px 0 0 0 #6a675f, 9px 0 0 0 #6a675f;
  }
  .card.back.selected:active{ transform:translateY(-5px) scale(.95); }
  /* face up */
  .card.face{
    background:var(--card); color:var(--card-ink);
    box-shadow: 0 -3px 0 0 var(--card), 0 3px 0 0 var(--card),
                -3px 0 0 0 var(--card), 3px 0 0 0 var(--card),
                7px 7px 0 0 #23231f;
  }
  .card.face.red{ color:var(--card-red); }
  /* suit svg sizes come from the sprite markup (uniform cell scale per
     variant); CSS only handles placement */
  .card .center-glyph svg{ display:block; }
  .card .corner{ position:absolute; line-height:1; text-align:center;
    font-family:'Press Start 2P', ui-monospace, monospace; font-size:12px; font-weight:400; }
  .card .corner.tl{ top:10px; left:9px; }
  /* bottom-right index reads upside down, like a real playing card */
  .card .corner.br{ bottom:10px; right:9px; transform:rotate(180deg); }
  .card .corner .r{ display:block; }
  .card .corner svg{ display:block; margin:4px auto 0; }

  .card.reveal-card{ width:188px; height:272px; animation:zoomIn .35s steps(6,end); }
  .card.reveal-card.face{
    box-shadow: 0 -5px 0 0 var(--card), 0 5px 0 0 var(--card),
                -5px 0 0 0 var(--card), 5px 0 0 0 var(--card),
                10px 10px 0 0 #23231f; }
  .card.reveal-card.back{
    box-shadow: 0 -5px 0 0 #71271f, 0 5px 0 0 #71271f,
                -5px 0 0 0 #71271f, 5px 0 0 0 #71271f; }
  .card.reveal-card.back svg{ width:44px; height:44px; }
  .card.reveal-card .corner{ font-size:20px; }
  .card.reveal-card .corner svg{ margin-top:6px; }
  @keyframes zoomIn{ from{ transform:scale(.4); opacity:.2 } to{ transform:scale(1); opacity:1 } }
  /* die + card sitting together on the reveal screen */
  .reveal-row{ display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; }

  /* thumbnail */
  .card.thumb{ width:46px; height:66px; }
  .card.thumb.face{
    box-shadow: 0 -2px 0 0 var(--card), 0 2px 0 0 var(--card),
                -2px 0 0 0 var(--card), 2px 0 0 0 var(--card),
                3px 3px 0 0 #23231f;
  }
  /* journal thumbnails show only the center suit sprite, no corner indices */
  .card.thumb .corner{ display:none; }

  /* ---------- planet visual ---------- */
  .planet{ border-radius:50%; box-shadow:0 0 40px rgba(255,255,255,.06); }
  /* Rendered planet canvas — the renderer paints its own sphere, halo and
     transparent background, so no border-radius/shadow here. */
  .planet-canvas{ display:block; }

  /* crescent moon (intro) — pixel sprite drawn by PixelMoon in app.src.jsx;
     hard edges, no glow, like the rest of the 8-bit kit */
  .moon{ display:block; }

  /* ---------- atmosphere: starfield (title + intro) ----------
     Pixel sparkles (crisp-edge SVG rects): big gold 4-arm stars, small gold
     pluses, blue pluses and square dots. Placed in outer "safe zones" only —
     top band, side strips, and the gap above the bottom chrome — so they never
     overlap text or buttons, and the center-top area (x 25–75%, upper half)
     stays empty so nothing crowds the intro-screen moon. No glow: hard edges. */
  :root{
    --star-gold: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7' shape-rendering='crispEdges' fill='%23e8c98a'><rect x='3' y='0' width='1' height='7'/><rect x='0' y='3' width='7' height='1'/><rect x='2' y='2' width='3' height='3'/></svg>");
    --star-gold-sm: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 5 5' shape-rendering='crispEdges' fill='%23e8c98a'><rect x='2' y='0' width='1' height='5'/><rect x='0' y='2' width='5' height='1'/></svg>");
    --star-blue: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3' shape-rendering='crispEdges' fill='%23a8c2eb'><rect x='1' y='0' width='1' height='3'/><rect x='0' y='1' width='3' height='1'/></svg>");
    --star-blue-dot: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1' shape-rendering='crispEdges' fill='%23a8c2eb'><rect width='1' height='1'/></svg>");
  }
  .sky{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-color:transparent;
    background-repeat:no-repeat;
    background-image:
      var(--star-gold), var(--star-gold), var(--star-gold), var(--star-gold), var(--star-gold),
      var(--star-gold-sm), var(--star-gold-sm), var(--star-gold-sm), var(--star-gold-sm), var(--star-gold-sm), var(--star-gold-sm),
      var(--star-blue), var(--star-blue), var(--star-blue), var(--star-blue), var(--star-blue), var(--star-blue),
      var(--star-blue-dot), var(--star-blue-dot), var(--star-blue-dot), var(--star-blue-dot);
    background-position:
      18% 6%, 78% 5%, 5% 28%, 95% 30%, 55% 85%,
      12% 9%, 14% 20%, 80% 8%, 4% 50%, 96% 52%, 75% 83%,
      24% 4%, 88% 16%, 6% 70%, 94% 72%, 30% 86%, 18% 13%,
      86% 24%, 92% 4%, 8% 42%, 96% 78%;
    background-size:
      14px 14px, 14px 14px, 14px 14px, 14px 14px, 14px 14px,
      10px 10px, 10px 10px, 10px 10px, 10px 10px, 10px 10px, 10px 10px,
      6px 6px, 6px 6px, 6px 6px, 6px 6px, 6px 6px, 6px 6px,
      4px 4px, 4px 4px, 4px 4px, 4px 4px;
  }

  /* ---------- journal entry ---------- */
  .entry-header{ display:flex; gap:14px; align-items:flex-start; padding-top:8px; }
  .entry-header .htext{ font-style:italic; color:var(--dim); font-size:12px; line-height:1.5; }
  .entry-field{
    flex:1; min-height:0; margin-top:18px; width:100%; background:transparent; color:var(--fg);
    border:1.5px solid var(--fg); border-radius:0; padding:18px; font-size:13.5px; line-height:1.65;
    font-family:inherit; resize:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  }
  .entry-field::placeholder{ color:var(--dim); }
  .entry-field:focus{ outline:none; border-color:var(--fg); }
  .entry-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:14px; }
  .entry-actions .btn{ min-width:0; flex:0 1 auto; }

  /* ---------- name planet ---------- */
  .name-field{
    background:transparent; border:none; border-bottom:1.5px solid var(--fg); color:var(--fg);
    font-family:inherit; font-size:18px; text-align:center; padding:10px 4px; width:min(280px,80vw);
  }
  .name-field::placeholder{ color:var(--dim); }
  .name-field:focus{ outline:none; }

  /* ---------- archive ---------- */
  .archive-title{ text-align:center; padding:24px 0 18px; letter-spacing:1px; }
  .archive-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; padding-bottom:90px; }
  .planet-module{ border:1.5px solid var(--line); border-radius:0; padding:18px 12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:12px; }
  .planet-module:active{ transform:scale(.98); }
  .planet-module .pname{ font-size:12px; }
  .planet-module .pdate{ font-size:11px; color:var(--dim); }
  .empty-archive{ text-align:center; color:var(--dim); font-style:italic; font-size:13px; line-height:1.6; max-width:28ch; }

  /* toast */
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom: calc(var(--safe-bottom) + 90px);
    background:var(--bg); border:1.5px solid var(--fg); border-radius:0; padding:14px 20px;
    display:flex; align-items:center; gap:28px; z-index:45; white-space:nowrap; font-size:13px; }
  .toast button{ background:none; border:none; color:var(--fg); font-size:14.5px; }

  /* ---------- full journal ---------- */
  .fj-header{ display:flex; gap:16px; align-items:flex-start; padding:8px 0 12px; }
  .fj-meta{ font-style:italic; color:var(--dim); font-size:11px; line-height:1.6; min-width:0; }
  .fj-meta .pn{ color:var(--fg); font-weight:700; }
  .fj-entry{ padding:22px 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:14px; min-width:0; }
  .fj-entry:first-of-type{ border-top:none; }
  .fj-entry-head{ display:flex; gap:12px; align-items:center; }
  .fj-body{ color:var(--fg); font-size:12px; line-height:1.7; white-space:pre-wrap;
    overflow-wrap:break-word; word-break:break-word; }

  /* ---------- overlays ---------- */
  .overlay{ position:fixed; inset:0; background:#000; z-index:60; display:flex;
    flex-direction:column; padding: calc(var(--safe-top) + 20px) 24px calc(var(--safe-bottom) + 20px); }
  .overlay.confirm{ align-items:center; justify-content:center; text-align:center; }
  .overlay .confirm-box{ display:flex; flex-direction:column; align-items:center; gap:30px;
    width:min(400px, 84vw); border:1.5px solid #3a3a3a; border-radius:0; padding:52px 28px; }
  .overlay .confirm-text{ font-size:14.5px; line-height:1.6; font-style:italic; color:var(--dim); max-width:26ch; }
  .close-x{ position:absolute; top: calc(var(--safe-top) + 16px); right:20px; background:none; border:none;
    color:var(--fg); font-size:24px; line-height:1; z-index:2; }
  .help-body{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding-top:40px; font-size:12px; line-height:1.75;
    color:var(--fg); white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; }
  .help-body .selectable{ }

  /* ---------- sketch ---------- */
  .sketch-wrap{ flex:1; display:flex; flex-direction:column; gap:16px; min-height:0; }
  .sketch-head{ text-align:center; align-self:center; margin-top:clamp(4px, 3vh, 26px); }
  .sketch-paper{ position:relative; width:100%; flex:1; min-height:240px;
    background:var(--card); border-radius:0; box-shadow:7px 7px 0 0 #23231f;
    overflow:hidden; touch-action:none; }
  .sketch-paper canvas{ position:absolute; inset:0; width:100%; height:100%; display:block;
    touch-action:none; cursor:crosshair;
    image-rendering:pixelated; image-rendering:crisp-edges; }
  .sketch-tools{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .tool-btn{ width:46px; height:46px; border-radius:0; border:1.5px solid var(--fg);
    background:transparent; color:var(--fg); display:flex; align-items:center; justify-content:center; }
  .tool-btn.active{ background:var(--fg); color:#000; }
  .tool-btn:active{ transform:scale(.94); }
  .tool-btn:disabled{ opacity:.32; }
  .tool-btn svg{ display:block; }
  .sketch-actions{ gap:10px; }
  .sketch-actions .btn{ padding:10px 16px; }
  .journal-sketch{ width:100%; display:block; border-radius:0; background:var(--card);
    box-shadow:5px 5px 0 0 #23231f;
    image-rendering:pixelated; image-rendering:crisp-edges; }

  .fade-in{ animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + the compiled app are vendored locally (same-origin) so the app has
     no external runtime dependency: it loads instantly and works fully offline.
     app.js is compiled from app.src.jsx (the editable JSX source) with
     @babel/preset-react — edit app.src.jsx and recompile, not app.js. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- Planet image generator. Module, so it runs (and sets window.PlanetRenderer)
     before the app module below executes. -->
<script type="module" src="planet-renderer.js"></script>

<!-- The app. Module so it stays deferred until planet-renderer has loaded. -->
<script type="module" src="app.js"></script>

<script>
  // Register the service worker for offline / installable PWA support.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
